services:
  mongodb:
    image: mongo:7
    container_name: ravenfold-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ravenfold-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongodb-data:
